<body style="margin:0;background:black;display:grid;place-items:center;height:100vh;overflow:hidden;user-select:none">
<canvas id=C width=700 height=700 style="background:black;cursor:crosshair;border:1px solid rgb(40,40,40)"></canvas>
<script>
(()=>{
  const x = C.getContext('2d'), R = 'rgb(215,25,32)', M = Math;
  let st = 'START', hp = 3, sc = 0, hi = 0, sa = 1.2, ang = 0, ast = [], pts = [], fr = 0, nxt = 15, wv = 1, ht = 0, emp = 0, er = 0;

  function sp(X, Y, c) {
    for (let i = 0; i < 4; i++) {
      const a = M.random() * 6.28;
      pts.push({ x: X, y: Y, u: M.cos(a)*2, v: M.sin(a)*2, l: 12, c });
    }
  }

  function rst() {
    hp = 3; sc = fr = ht = emp = er = 0; nxt = 15; wv = 1; sa = 1.2;
    ast = []; pts = []; st = 'PLAY';
  }

  function spawn() {
    const e = M.floor(M.random() * 4);
    let X = e % 2 === 0 ? M.random() * 700 : (e === 1 ? 715 : -15);
    let Y = e % 2 === 1 ? M.random() * 700 : (e === 2 ? 715 : -15);
    const a = M.atan2(350 - Y, 350 - X), s = M.min(2.2, 0.9 + wv * 0.2);
    ast.push({ x: X, y: Y, u: M.cos(a)*s, v: M.sin(a)*s, h: wv > 1 && M.random() < 0.3 ? 2 : 1, d: 0 });
  }

  function upd() {
    if (st !== 'PLAY') return;

    if (emp > 0) emp--;
    if (er > 0 && (er += 14) > 280) er = 0;

    if (hp < 5 && ++ht >= 480) {
      hp++; ht = 0; sp(350, 350, 'white');
    }

    if (++fr % M.max(50, 130 - wv * 15) === 0) spawn();

    for (let i = pts.length - 1; i >= 0; i--) {
      const p = pts[i]; p.x += p.u; p.y += p.v;
      if (--p.l <= 0) pts.splice(i, 1);
    }

    for (let i = ast.length - 1; i >= 0; i--) {
      const a = ast[i]; a.x += a.u; a.y += a.v;
      const d = M.hypot(a.x - 350, a.y - 350), g = M.atan2(a.y - 350, a.x - 350);

      if (!a.d && er > 0 && M.abs(d - er) < 22) {
        a.d = 1; a.u = M.cos(g)*3; a.v = M.sin(g)*3;
        sc++; sp(a.x, a.y, 'white');
      }

      if (!a.d) {
        if (M.abs(d - 80) < 14) {
          const df = M.atan2(M.sin(g - ang), M.cos(g - ang));
          if (M.abs(df) <= sa / 2) {
            if (--a.h <= 0) {
              a.d = 1; a.u = M.cos(g)*2.5; a.v = M.sin(g)*2.5;
              if (++sc > hi) hi = sc;
              sp(a.x, a.y, 'white');
              if (sc % 20 === 0) wv++;
              if (sc >= nxt) { nxt += 15; st = 'UP'; }
            } else {
              a.u = -a.u * 0.7; a.v = -a.v * 0.7;
              sp(a.x, a.y, R);
            }
          }
        }
        if (!a.d && d <= 24) {
          if (--hp <= 0) { hp = 0; st = 'OVER'; }
          sp(a.x, a.y, R);
          ast.splice(i, 1); continue;
        }
      }
      if (a.x < -30 || a.x > 730 || a.y < -30 || a.y > 730) ast.splice(i, 1);
    }
  }

  function arc(px, py, r, b=0, e=6.28) {
    x.beginPath(); x.arc(px, py, r, b, e);
  }

  function drw() {
    x.clearRect(0, 0, 700, 700);

    if (er > 0) {
      x.strokeStyle = 'white'; x.lineWidth = 2;
      arc(350, 350, er); x.stroke();
    }

    x.strokeStyle = x.fillStyle = hp > 1 ? 'white' : R; x.lineWidth = 2;
    arc(350, 350, 14); x.stroke();
    arc(350, 350, 4); x.fill();

    x.strokeStyle = 'white'; x.lineWidth = 6; x.lineCap = 'round';
    arc(350, 350, 80, ang - sa/2, ang + sa/2); x.stroke();

    for (const a of ast) {
      arc(a.x, a.y, 8);
      if (a.d) { x.strokeStyle = 'gray'; x.lineWidth = 1; x.stroke(); }
      else { x.fillStyle = a.h > 1 ? R : 'white'; x.fill(); }
    }

    for (const p of pts) { x.fillStyle = p.c; x.fillRect(p.x, p.y, 2, 2); }

    x.fillStyle = 'white'; x.font = '13px monospace'; x.textAlign = 'left';
    x.fillText(`SC:${sc} HI:${hi} WV:${wv} HP:${hp} EMP:${emp<=0?'RDY':(emp/60).toFixed(0)+'S'}`, 25, 35);

    x.textAlign = 'center';
    if (st !== 'PLAY') {
      x.fillStyle = 'rgba(0,0,0,0.85)'; x.fillRect(0, 0, 700, 700);
      x.fillStyle = st === 'OVER' ? R : 'white'; x.font = 'bold 22px monospace';
      x.fillText(st === 'UP' ? 'UPGRADE' : (st === 'OVER' ? 'OFFLINE' : 'DEFLECTOR'), 350, 335);
      x.fillStyle = 'white'; x.font = '13px monospace';
      x.fillText(st === 'UP' ? '[1] ARC [2] HEAL' : 'SPACE TO START', 350, 370);
    }
  }

  function loop() { upd(); drw(); requestAnimationFrame(loop); }

  onmousemove = e => {
    const r = C.getBoundingClientRect();
    ang = M.atan2(e.clientY - r.top - 350, e.clientX - r.left - 350);
  };

  onkeydown = e => {
    if ((st === 'START' || st === 'OVER') && e.code === 'Space') rst();
    else if (st === 'UP') {
      if (e.key === '1') { sa = M.min(5, sa + 0.3); st = 'PLAY'; }
      if (e.key === '2') { hp = M.min(5, hp + 1); st = 'PLAY'; }
    }
  };

  onclick = () => {
    if (st === 'START' || st === 'OVER') rst();
    else if (st === 'PLAY' && emp <= 0) { emp = 300; er = 20; }
  };

  loop();
})();
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deflector Shield</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: black; color: white; font-family: monospace;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; overflow: hidden; user-select: none;
    }
    canvas {
      background: black; cursor: crosshair; border-radius: 4px;
      border: 1px solid rgb(40, 40, 40);
    }
  </style>
</head>
<body>
  <canvas id="c" width="700" height="700"></canvas>
  <script>
    const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
    const W = cvs.width, H = cvs.height, CX = W / 2, CY = H / 2;
    const RED = 'rgb(215, 25, 32)', GREY = 'rgb(40, 40, 40)', DIM = 'rgb(120, 120, 120)';
    let state = 'START', hp = 3, score = 0, best = 0;
    let shieldArc = 1.2, shieldAngle = 0;
    let asteroids = [], particles = [], frame = 0;
    let nextUpgrade = 15, upgradeStep = 15, wave = 1, waveBanner = 0, healTimer = 0, healDelay = 480;
    let empCd = 0, empRadius = 0, actx;

    function beep(f, type = 'sine', d = 0.1, ef = f) {
      try {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === 'suspended') actx.resume();
        const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
        o.type = type; o.frequency.setValueAtTime(f, t);
        o.frequency.exponentialRampToValueAtTime(Math.max(1, ef), t + d);
        g.gain.setValueAtTime(0.18, t); g.gain.linearRampToValueAtTime(0.01, t + d);
        o.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t + d);
      } catch (e) {}
    }
    function spawnParticles(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * 6.28, s = 1 + Math.random() * 3.5;
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 25, color });
      }
    }
    function resetGame() {
      hp = 3; score = 0; nextUpgrade = 15; upgradeStep = 15; wave = 1; waveBanner = 0; healTimer = 0; healDelay = 480;
      empCd = 0; empRadius = 0; shieldArc = 1.2; asteroids = []; particles = []; frame = 0; state = 'PLAYING';
    }
    function spawnAsteroid() {
      const edge = Math.floor(Math.random() * 4);
      let x = edge % 2 === 0 ? Math.random() * W : (edge === 1 ? W + 15 : -15), y = edge % 2 === 1 ? Math.random() * H : (edge === 2 ? H + 15 : -15);
      const angle = Math.atan2(CY - y, CX - x), spd = Math.min(2.2, 0.8 + Math.random() * 0.3 + (wave - 1) * 0.2);
      const isDrain = wave >= 2 && Math.random() < 0.15, isHeavy = !isDrain && wave >= 2 && Math.random() < 0.35;
      asteroids.push({ x, y, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd, r: isHeavy ? 12 : (isDrain ? 10 : 9), hits: isHeavy ? 2 : 1, isHeavy, isDrain, deflected: false });
    }
    function update() {
      if (state !== 'PLAYING') return;
      if (empCd > 0) empCd--;
      if (empRadius > 0 && (empRadius += 12) > 250) empRadius = 0;
      if (hp < 5 && ++healTimer >= healDelay) {
        hp++; healTimer = 0; beep(660, 'sine', 0.15, 880); spawnParticles(CX, CY, 'white', 8);
      } else if (hp >= 5) healTimer = 0;
      const spawnInterval = Math.max(55, 140 - (wave - 1) * 18);
      if (++frame % spawnInterval === 0 && asteroids.filter(a => !a.deflected).length < wave + 2) spawnAsteroid();
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.x += p.vx; p.y += p.vy;
        if (--p.life <= 0) particles.splice(i, 1);
      }
      for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.x += a.vx; a.y += a.vy;
        const d = Math.hypot(a.x - CX, a.y - CY), ang = Math.atan2(a.y - CY, a.x - CX);
        if (!a.deflected && empRadius > 0 && Math.abs(d - empRadius) < 22) {
          a.deflected = true; a.vx = Math.cos(ang) * 3; a.vy = Math.sin(ang) * 3;
          if (++score > best) best = score;
          spawnParticles(a.x, a.y, 'white', 10);
          if (score % 20 === 0) { wave++; waveBanner = 90; }
          if (score >= nextUpgrade) { nextUpgrade += (upgradeStep += 5); state = 'UPGRADE'; }
        }
        if (!a.deflected) {
          if (Math.abs(d - 80) < 14) {
            const diff = Math.atan2(Math.sin(ang - shieldAngle), Math.cos(ang - shieldAngle));
            if (Math.abs(diff) <= shieldArc / 2) {
              if (a.isDrain) {
                shieldArc = Math.max(0.6, shieldArc - 0.3);
                beep(200, 'sawtooth', 0.2, 80);
                spawnParticles(a.x, a.y, RED, 14);
              }
              if (--a.hits <= 0) {
                a.deflected = true; a.vx = Math.cos(ang) * 2.4; a.vy = Math.sin(ang) * 2.4;
                if (++score > best) best = score;
                beep(520, 'sine', 0.12, 920); spawnParticles(a.x, a.y, 'white', 12);
                if (score % 20 === 0) { wave++; waveBanner = 90; }
                if (score >= nextUpgrade) { nextUpgrade += (upgradeStep += 5); state = 'UPGRADE'; }
              } else {
                a.vx = -a.vx * 0.7; a.vy = -a.vy * 0.7;
                beep(320, 'triangle', 0.1, 480); spawnParticles(a.x, a.y, RED, 8);
              }
            }
          }
          if (!a.deflected && d <= 18 + a.r) {
            if (a.isDrain) shieldArc = Math.max(0.6, shieldArc - 0.3);
            if (--hp <= 0) { hp = 0; state = 'GAMEOVER'; }
            beep(140, 'sawtooth', 0.25, 40); spawnParticles(a.x, a.y, RED, 18);
            asteroids.splice(i, 1);
            continue;
          }
        }
        if (a.x < -40 || a.x > W + 40 || a.y < -40 || a.y > H + 40) asteroids.splice(i, 1);
      }
    }

    function drawBanner(t, col, s1, s2, act) {
      ctx.fillStyle = 'rgba(0,0,0,0.9)'; ctx.fillRect(0, 0, W, H); ctx.textAlign = 'center';
      ctx.fillStyle = col; ctx.font = 'bold 22px monospace'; ctx.fillText(t, CX, CY - 40);
      ctx.fillStyle = DIM; ctx.font = '12px monospace'; ctx.fillText(s1, CX, CY - 8);
      if (s2) ctx.fillText(s2, CX, CY + 14);
      ctx.fillStyle = 'white'; ctx.fillText(act, CX, CY + 55);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.save();
      ctx.setLineDash([2, 8]); ctx.strokeStyle = 'rgb(30, 30, 30)'; ctx.lineWidth = 1;
      [40, 80, 150, 230, 310].forEach(r => { ctx.beginPath(); ctx.arc(CX, CY, r, 0, 6.28); ctx.stroke(); });
      ctx.restore();
      if (empRadius > 0) {
        ctx.save(); ctx.setLineDash([3, 5]); ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(CX, CY, empRadius, 0, 6.28); ctx.stroke(); ctx.restore();
      }
      const coreCol = hp > 1 ? 'white' : RED;
      ctx.strokeStyle = ctx.fillStyle = coreCol; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(CX, CY, 16, 0, 6.28); ctx.stroke();
      ctx.beginPath(); ctx.arc(CX, CY, 5, 0, 6.28); ctx.fill();
      ctx.save();
      ctx.shadowColor = 'white'; ctx.shadowBlur = 10;
      ctx.strokeStyle = 'white'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(CX, CY, 80, shieldAngle - shieldArc / 2, shieldAngle + shieldArc / 2); ctx.stroke();
      ctx.restore();
      for (const a of asteroids) {
        if (a.deflected) {
          ctx.strokeStyle = DIM; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 6.28); ctx.stroke();
        } else {
          ctx.fillStyle = a.isDrain ? RED : 'rgb(220, 220, 220)'; ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 6.28); ctx.fill();
          if (a.isHeavy) { ctx.fillStyle = a.hits === 2 ? RED : GREY; ctx.beginPath(); ctx.arc(a.x, a.y, 4, 0, 6.28); ctx.fill(); }
          else if (a.isDrain) { ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(a.x, a.y, 3, 0, 6.28); ctx.fill(); }
        }
      }
      for (const p of particles) { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 2, 2); }
      ctx.fillStyle = 'white'; ctx.font = '12px monospace'; ctx.textAlign = 'left';
      ctx.fillText(`SCORE // ${String(score).padStart(4, '0')}`, 28, 38);
      ctx.fillText(`BEST  // ${String(best).padStart(4, '0')}`, 28, 58);
      ctx.fillText(`WAVE  // 0${wave}`, 28, 78);
      ctx.fillText('CORE  //', 28, 98);
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = i < hp ? (hp === 1 ? RED : 'white') : GREY;
        ctx.beginPath(); ctx.arc(95 + i * 14, 94, 3.5, 0, 6.28); ctx.fill();
      }
      ctx.fillText(`SHLD  // ${Math.round((shieldArc / 6.283) * 100)}%`, 28, 118);
      ctx.fillText(`REGEN // ${healDelay / 60}S`, 28, 138);
      ctx.fillStyle = empCd <= 0 ? 'white' : DIM;
      ctx.fillText(`EMP   // ${empCd <= 0 ? 'READY [L-CLICK]' : (empCd / 60).toFixed(1) + 'S'}`, 28, 158);
      if (waveBanner > 0 && state === 'PLAYING') {
        waveBanner--;
        ctx.textAlign = 'center'; ctx.fillStyle = RED; ctx.font = 'bold 16px monospace';
        ctx.fillText(`( WAVE // 0${wave} )`, CX, CY - 110);
      }
      if (state === 'START') {
        drawBanner('DEFLECTOR', 'white', 'ORBIT SHIELD TO REPEL // L-CLICK FOR EMP', 'TOUCH DEFLECTOR TO REVERSE VELOCITY', '( CLICK OR SPACE TO INITIALIZE )');
      } else if (state === 'UPGRADE') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.9)'; ctx.fillRect(0, CY - 65, W, 130);
        ctx.textAlign = 'center'; ctx.fillStyle = 'white'; ctx.font = 'bold 15px monospace';
        ctx.fillText('UPGRADE // SELECT', CX, CY - 18);
        ctx.font = '12px monospace';
        const sMax = shieldArc >= 5.65, rMax = healDelay <= 60;
        ctx.fillStyle = sMax ? RED : DIM; ctx.fillText(sMax ? '[1] DEFLECTOR (MAX)' : '[1] DEFLECTOR (+0.35 RAD)', CX - 150, CY + 8);
        ctx.fillStyle = DIM; ctx.fillText('|', CX, CY + 8);
        ctx.fillStyle = rMax ? RED : DIM; ctx.fillText(rMax ? '[2] REGEN ACCEL (MAX)' : '[2] REGEN ACCEL (-1S)', CX + 150, CY + 8);
        ctx.fillStyle = RED; ctx.font = '11px monospace'; ctx.fillText('PRESS KEY [1] OR [2] TO COMMIT', CX, CY + 34);
      } else if (state === 'GAMEOVER') {
        drawBanner('CORE // OFFLINE', RED, `FINAL SCORE // ${score}  |  BEST // ${best}`, '', '( CLICK OR SPACE TO REBOOT )');
      }
    }

    function loop() {
      update(); draw(); requestAnimationFrame(loop);
    }
    window.addEventListener('mousemove', (e) => {
      const rect = cvs.getBoundingClientRect();
      shieldAngle = Math.atan2(e.clientY - rect.top - CY, e.clientX - rect.left - CX);
    });
    window.addEventListener('keydown', (e) => {
      if ((state === 'START' || state === 'GAMEOVER') && e.code === 'Space') resetGame();
      else if (state === 'UPGRADE') {
        const sMax = shieldArc >= 5.65, rMax = healDelay <= 60;
        if (e.key === '1' && !sMax) { shieldArc = Math.min(5.65, shieldArc + 0.35); state = 'PLAYING'; beep(587, 'sine', 0.2, 880); }
        else if (e.key === '2' && (!rMax || hp < 5)) { healDelay = Math.max(60, healDelay - 60); hp = Math.min(5, hp + 1); state = 'PLAYING'; beep(587, 'sine', 0.2, 880); }
        else if (sMax && rMax) { state = 'PLAYING'; beep(587, 'sine', 0.2, 880); }
        else if (e.key === '1' || e.key === '2') beep(120, 'sawtooth', 0.12, 80);
      }
    });
    cvs.addEventListener('click', () => {
      if (state === 'START' || state === 'GAMEOVER') resetGame();
      else if (state === 'PLAYING' && empCd <= 0) {
        empCd = 360; empRadius = 24; beep(90, 'sawtooth', 0.25, 25);
      }
    });
    loop();
  </script>
</body>
</html>
